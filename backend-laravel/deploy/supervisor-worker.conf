[program:dataminer-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dataminer/artisan queue:work pgsql --sleep=1 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=8
redirect_stderr=true
stdout_logfile=/var/log/dataminer/worker.log
stopwaitsecs=3600
